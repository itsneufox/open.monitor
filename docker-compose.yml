services:
  mysql:
    image: mysql:8.0
    container_name: openmonitor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: openmonitor
      MYSQL_USER: openmonitor
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backups:/backups
    networks:
      - openmonitor-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  bot:
    build: .
    container_name: openmonitor-bot
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - TOKEN=${TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - DATABASE_URL=mysql://openmonitor:${MYSQL_PASSWORD}@mysql:3306/openmonitor
      - OWNER_ID=${OWNER_ID}
      - OWNER_GUILD_ID=${OWNER_GUILD_ID:-}
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WEBHOOK_LOG_URL=${WEBHOOK_LOG_URL}
      - SECURITY_LOG_GUILD_ID=${SECURITY_LOG_GUILD_ID:-}
      - SECURITY_LOG_CHANNEL_ID=${SECURITY_LOG_CHANNEL_ID:-}
    volumes:
      - ./logs:/app/logs
    networks:
      - openmonitor-network
    labels:
      - discord-logger.enabled=true

  backup:
    profiles: ["backup"]
    build:
      context: ./docker/backup
    container_name: openmonitor-backup
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=openmonitor
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_BUCKET=${R2_BUCKET}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - BACKUP_PREFIX=${BACKUP_PREFIX:-mysql/production}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_RETRY_SECONDS=${BACKUP_RETRY_SECONDS:-300}
      - XDG_CONFIG_HOME=/tmp/config
      - XDG_CACHE_HOME=/tmp/cache
    volumes:
      - backup_staging:/backups
    networks:
      - openmonitor-network
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/last-backup-success && { test ! -f /tmp/last-backup-failure || test /tmp/last-backup-success -nt /tmp/last-backup-failure; }"]
      interval: 5m
      timeout: 5s
      retries: 1
      start_period: 15m

volumes:
  mysql_data:
    driver: local
  backup_staging:
    driver: local

networks:
  openmonitor-network:
    driver: bridge
